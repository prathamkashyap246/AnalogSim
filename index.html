<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AnalogSim</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>AnalogSim</h1>
      <p class="lead">
        Prototype for real-world analog + digital circuit simulation using structured experimental data.
      </p>

      <section class="card">
        <h2>Analog: NMOS non-ideal simulation</h2>
        <form id="nmos-form" class="grid">
          <label>Vgs (V)<input name="vgs" type="number" step="0.01" value="1.8" required /></label>
          <label>Vds (V)<input name="vds" type="number" step="0.01" value="1.2" required /></label>
          <label>Vth0 (V)<input name="vth0" type="number" step="0.01" value="0.6" required /></label>
          <label>Body bias Vsb (V)<input name="vsb" type="number" step="0.01" value="0.2" required /></label>
          <label>Body factor γ<input name="gamma" type="number" step="0.01" value="0.4" required /></label>
          <label>2ϕF (V)<input name="phi2f" type="number" step="0.01" value="0.7" required /></label>
          <label>k (mA/V²)<input name="k" type="number" step="0.01" value="1.5" required /></label>
          <label>λ (1/V)<input name="lambda" type="number" step="0.001" value="0.04" required /></label>
          <label>Hot-electron degradation factor (0-1)<input name="hotFactor" type="number" min="0" max="1" step="0.01" value="0.95" required /></label>
          <button type="submit">Simulate NMOS</button>
        </form>
        <output id="nmos-output" class="output"></output>
      </section>

      <section class="card">
        <h2>Digital: gate scenario estimate</h2>
        <form id="digital-form" class="grid">
          <label>Base delay (ns)<input name="baseDelay" type="number" step="0.01" value="2.1" required /></label>
          <label>Temperature (°C)<input name="temperature" type="number" step="1" value="25" required /></label>
          <label>Supply voltage Vdd (V)<input name="vdd" type="number" step="0.01" value="1.0" required /></label>
          <label>Activity factor α<input name="activity" type="number" min="0" max="1" step="0.01" value="0.25" required /></label>
          <label>Load capacitance C (pF)<input name="capacitancePf" type="number" step="0.01" value="5" required /></label>
          <label>Clock frequency (MHz)<input name="frequencyMhz" type="number" step="0.1" value="100" required /></label>
          <button type="submit">Estimate digital behavior</button>
        </form>
        <output id="digital-output" class="output"></output>
      </section>

      <section class="card">
        <h2>Experimental data</h2>
        <p>Loaded from <code>data/experiments.sample.json</code></p>
        <div id="dataset-meta" class="meta"></div>
        <table>
          <thead>
            <tr>
              <th>Record</th>
              <th>Type</th>
              <th>Device/Board</th>
              <th>Conditions</th>
              <th>Measured outputs</th>
            </tr>
          </thead>
          <tbody id="dataset-body"></tbody>
        </table>
      </section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
